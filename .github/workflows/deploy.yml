name: Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://dcv.pcnaid.com
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
          VITE_AUTH_API_BASE_URL: ${{ vars.VITE_AUTH_API_BASE_URL }}
          VITE_PLATFORM_OWNER_EMAIL: ${{ vars.VITE_PLATFORM_OWNER_EMAIL }}
          VITE_STRIPE_PRICE_PRO: ${{ vars.VITE_STRIPE_PRICE_PRO }}
          VITE_STRIPE_PRICE_AGENCY: ${{ vars.VITE_STRIPE_PRICE_AGENCY }}
          VITE_CLOUDFLARE_CLIENT_ID: ${{ vars.VITE_CLOUDFLARE_CLIENT_ID }}
          VITE_GODADDY_CLIENT_ID: ${{ vars.VITE_GODADDY_CLIENT_ID }}

      - name: Install API Worker dependencies
        run: npm ci
        working-directory: workers/api

      - name: Compile API Worker
        run: npx --yes wrangler@4 deploy --env production --dry-run --outdir ../../.wrangler-dry-run/api
        working-directory: workers/api

      - name: Install consumer Worker dependencies
        run: npm ci
        working-directory: workers/consumer

      - name: Compile consumer Worker
        run: npx --yes wrangler@4 deploy --dry-run --outdir ../../.wrangler-dry-run/consumer
        working-directory: workers/consumer

      - name: Install cron Worker dependencies
        run: npm ci
        working-directory: workers/cron

      - name: Compile cron Worker
        run: npx --yes wrangler@4 deploy --dry-run --outdir ../../.wrangler-dry-run/cron
        working-directory: workers/cron

      - name: Install DLQ Worker dependencies
        run: npm ci
        working-directory: workers/dlq

      - name: Compile DLQ Worker
        run: npx --yes wrangler@4 deploy --dry-run --outdir ../../.wrangler-dry-run/dlq
        working-directory: workers/dlq

  deploy:
    name: deploy
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://dcv.pcnaid.com
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
          VITE_AUTH_API_BASE_URL: ${{ vars.VITE_AUTH_API_BASE_URL }}
          VITE_PLATFORM_OWNER_EMAIL: ${{ vars.VITE_PLATFORM_OWNER_EMAIL }}
          VITE_STRIPE_PRICE_PRO: ${{ vars.VITE_STRIPE_PRICE_PRO }}
          VITE_STRIPE_PRICE_AGENCY: ${{ vars.VITE_STRIPE_PRICE_AGENCY }}
          VITE_CLOUDFLARE_CLIENT_ID: ${{ vars.VITE_CLOUDFLARE_CLIENT_ID }}
          VITE_GODADDY_CLIENT_ID: ${{ vars.VITE_GODADDY_CLIENT_ID }}

      - name: Install consumer Worker dependencies
        run: npm ci
        working-directory: workers/consumer

      - name: Install cron Worker dependencies
        run: npm ci
        working-directory: workers/cron

      - name: Install DLQ Worker dependencies
        run: npm ci
        working-directory: workers/dlq

      - name: Install API Worker dependencies
        run: npm ci
        working-directory: workers/api

      - name: Deploy consumer Worker
        run: npx --yes wrangler@4 deploy
        working-directory: workers/consumer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy cron Worker
        run: npx --yes wrangler@4 deploy
        working-directory: workers/cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy DLQ Worker
        run: npx --yes wrangler@4 deploy
        working-directory: workers/dlq
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API Worker
        run: npx --yes wrangler@4 deploy --env production
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy frontend Worker
        run: npx --yes wrangler@4 deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check production health
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if http_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 https://dcv.pcnaid.com/health)"; then
              if [ "$http_code" = "200" ]; then
                exit 0
              fi
            else
              http_code="request-failed"
            fi

            echo "Health check attempt ${attempt}/5 returned ${http_code}."
            if [ "$attempt" -lt 5 ]; then
              sleep 10
            fi
          done

          exit 1
